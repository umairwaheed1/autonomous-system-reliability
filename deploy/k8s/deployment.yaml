apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-system-reliability
  namespace: reliability-system
  labels:
    app.kubernetes.io/name: autonomous-system-reliability
    app.kubernetes.io/component: execution-pipeline
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: autonomous-system-reliability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autonomous-system-reliability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: reliability-engine
          image: autonomous-system-reliability:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
            requests:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://localhost:4317"
            - name: RECOVERY_TIMEOUT_MS
              value: "350"

        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:latest
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"